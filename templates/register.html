{% extends 'base.html' %}

{% block title %}Create Account | Personal Finance Tracker{% endblock %}

{% block auth_content %}
<div class="auth-page">
    <div class="auth-box">
        <div class="text-center mb-4">
            <div class="auth-icon-badge">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h2 class="fw-bold mb-1" style="letter-spacing: -0.02em;">Create Account</h2>
            <p class="text-muted">Start tracking your income, expenses & savings</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <!-- Full Name -->
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" class="form-control border-start-0 ps-1" name="name" placeholder="John Doe" required autofocus>
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" class="form-control border-start-0 ps-1" name="email" placeholder="name@example.com" required>
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">Password (min 6 characters)</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" class="form-control border-start-0 border-end-0 ps-1" name="password" id="regPassword" placeholder="Create password" minlength="6" required>
                    <button class="btn btn-outline-secondary toggle-password-btn border-start-0 bg-light text-muted" type="button" data-target="regPassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-4">
                <label class="form-label">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0">
                        <i class="bi bi-shield-check"></i>
                    </span>
                    <input type="password" class="form-control border-start-0 border-end-0 ps-1" name="confirm_password" id="regConfirmPassword" placeholder="Confirm password" minlength="6" required>
                    <button class="btn btn-outline-secondary toggle-password-btn border-start-0 bg-light text-muted" type="button" data-target="regConfirmPassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                <span>Complete Registration</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
            <p class="text-muted small mb-0">
                Already have an account? 
                <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
