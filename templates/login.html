{% extends 'base.html' %}

{% block title %}Sign In | Personal Finance Tracker{% endblock %}

{% block auth_content %}
<div class="auth-page">
    <div class="auth-box">
        <div class="text-center mb-4">
            <div class="auth-icon-badge">
                <i class="bi bi-wallet2"></i>
            </div>
            <h2 class="fw-bold mb-1" style="letter-spacing: -0.02em;">Welcome Back</h2>
            <p class="text-muted">Sign in to manage your budget & transactions</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" class="form-control border-start-0 ps-1" name="email" placeholder="name@example.com" required autofocus>
                </div>
            </div>

            <!-- Password with Show/Hide Toggle -->
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label mb-0">Password</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" class="form-control border-start-0 border-end-0 ps-1" name="password" id="loginPassword" placeholder="Enter password" required>
                    <button class="btn btn-outline-secondary toggle-password-btn border-start-0 bg-light text-muted" type="button" data-target="loginPassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                <span>Sign In to Dashboard</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
            <p class="text-muted small mb-0">
                Don't have an account yet? 
                <a href="{{ url_for('register') }}" class="text-primary fw-semibold text-decoration-none">Create an account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
